<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width initial-scale=1.0">
    <title>Document</title>
    <style> 
        body{
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('digite seu nome')
        document.write(`ola, <strong>${nome}</strong>,seu nome tem ${nome.length} letras. <br/>`)
        document.write(`seu nome em maiusculo é ${nome.toUpperCase()}. <br/>`)
        document.write(`seu nome em minusculo fica ${nome.toLowerCase()}. <br/>`)
    </script>
</body>
</html>
