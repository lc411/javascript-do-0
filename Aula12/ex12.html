<!-- Declaração do tipo de documento como HTML5 -->
<!DOCTYPE html>
<!-- Elemento raiz HTML com idioma português do Brasil -->
<html lang="pt-BR">
<head>
    <!-- Define o charset como UTF-8 para suportar acentuação -->
    <meta charset="UTF-8">
    <!-- Meta tag para responsividade em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece na aba do navegador -->
    <title>Analisador de Números</title>
    <!-- Importa o arquivo CSS de estilização -->
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <!-- Cabeçalho da página -->
    <header>
        <!-- Título principal da página -->
        <h1>Analisador de Nùmeros</h1>
    </header>
    <!-- Seção principal com os elementos interativos -->
    <section>
        <!-- Div para entrada de dados -->
        <div id="analise">
            <!-- Campo de entrada de número entre 1 e 100 -->
            Número (Entre 1 e 100:) <input type="number" name="num" id="txtn">
            <!-- Botão que chama a função adicionar() ao ser clicado -->
            <input type="button" value="Adicionar" onclick="adicionar()">
        </div>
        <!-- Div para exibição dos resultados -->
        <div id="resultado">
            <!-- Select (lista) que vai exibir os números adicionados -->
            <select name="Analisador" id="analis" size="10"></select>
                <!-- Opção vazia padrão -->
                <option> </option>
                <!-- Botão que chama a função analisador() ao ser clicado -->
                <input type="button" value="Finalizar" onclick="analisador()">
        </select>
        </div>
    </section>
    <!-- Rodapé da página -->
    <footer>
        <!-- Parágrafo com copyright -->
        <p>&copy; Leonardo Cerqueira</p>
    </footer>
    <!-- Importa o arquivo JavaScript com as funções -->
    <script src="scripter.js"></script>
</body>
</html>
